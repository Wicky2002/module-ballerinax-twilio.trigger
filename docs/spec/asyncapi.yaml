asyncapi: 3.0.0
# Twilio signs the full URL it posts to, followed by the form parameters sorted by name, with HMAC-SHA1 keyed by
# the account's Auth Token, and sends it Base64-encoded in X-Twilio-Signature. Each channel has its own path, so
# the signed URL is the configured public base URL plus the request path.
x-ballerina-auth:
  header: X-Twilio-Signature
  signature:
    algorithm: sha1
    encoding: base64
    headerFormat: "$signature"
    input: "$config('webhookBaseUrl') . $uri . $formParams"
info:
  title: Twilio Events API
  version: 1.0.0
  description: >-
    Status callbacks for Twilio programmable voice calls and messages. Twilio posts them as form-encoded parameters
    to the StatusCallback URL of a call or message (or of its phone number or Messaging Service).
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Contact Center
    url: https://www.twilio.com/learn/contact-center
  externalDocs:
    description: Twilio All API Reference Documentation
    url: https://www.twilio.com/docs/all
defaultContentType: application/x-www-form-urlencoded
channels:
  callStatus:
    address: callStatus
    description: Call status callbacks, served at `/callStatus` and identified by `CallStatus`.
    x-ballerina-event-identifier:
      type: body
      path: CallStatus
    messages:
      callStatusInitiated:
        x-ballerina-event-type: initiated
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusQueued:
        x-ballerina-event-type: queued
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusRinging:
        x-ballerina-event-type: ringing
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusInProgress:
        x-ballerina-event-type: in-progress
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusCompleted:
        x-ballerina-event-type: completed
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusBusy:
        x-ballerina-event-type: busy
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusFailed:
        x-ballerina-event-type: failed
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusNoAnswer:
        x-ballerina-event-type: no-answer
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
      callStatusCanceled:
        x-ballerina-event-type: canceled
        payload:
          $ref: '#/components/schemas/CallStatusEventWrapper'
    bindings:
      http:
        method: POST
  smsStatus:
    address: smsStatus
    description: Message status callbacks, served at `/smsStatus` and identified by `MessageStatus`.
    x-ballerina-event-identifier:
      type: body
      path: MessageStatus
    messages:
      smsStatusAccepted:
        x-ballerina-event-type: accepted
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusQueued:
        x-ballerina-event-type: queued
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusSending:
        x-ballerina-event-type: sending
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusSent:
        x-ballerina-event-type: sent
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusFailed:
        x-ballerina-event-type: failed
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusDelivered:
        x-ballerina-event-type: delivered
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusUndelivered:
        x-ballerina-event-type: undelivered
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusReceiving:
        x-ballerina-event-type: receiving
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusReceived:
        x-ballerina-event-type: received
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusScheduled:
        x-ballerina-event-type: scheduled
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusRead:
        x-ballerina-event-type: read
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusCanceled:
        x-ballerina-event-type: canceled
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
      smsStatusPartiallyDelivered:
        x-ballerina-event-type: partially_delivered
        payload:
          $ref: '#/components/schemas/SmsStatusChangeEventWrapper'
    bindings:
      http:
        method: POST
operations:
  callStatus:
    action: receive
    channel:
      $ref: '#/channels/callStatus'
    messages:
      - $ref: '#/channels/callStatus/messages/callStatusInitiated'
      - $ref: '#/channels/callStatus/messages/callStatusQueued'
      - $ref: '#/channels/callStatus/messages/callStatusRinging'
      - $ref: '#/channels/callStatus/messages/callStatusInProgress'
      - $ref: '#/channels/callStatus/messages/callStatusCompleted'
      - $ref: '#/channels/callStatus/messages/callStatusBusy'
      - $ref: '#/channels/callStatus/messages/callStatusFailed'
      - $ref: '#/channels/callStatus/messages/callStatusNoAnswer'
      - $ref: '#/channels/callStatus/messages/callStatusCanceled'
  smsStatus:
    action: receive
    channel:
      $ref: '#/channels/smsStatus'
    messages:
      - $ref: '#/channels/smsStatus/messages/smsStatusAccepted'
      - $ref: '#/channels/smsStatus/messages/smsStatusQueued'
      - $ref: '#/channels/smsStatus/messages/smsStatusSending'
      - $ref: '#/channels/smsStatus/messages/smsStatusSent'
      - $ref: '#/channels/smsStatus/messages/smsStatusFailed'
      - $ref: '#/channels/smsStatus/messages/smsStatusDelivered'
      - $ref: '#/channels/smsStatus/messages/smsStatusUndelivered'
      - $ref: '#/channels/smsStatus/messages/smsStatusReceiving'
      - $ref: '#/channels/smsStatus/messages/smsStatusReceived'
      - $ref: '#/channels/smsStatus/messages/smsStatusScheduled'
      - $ref: '#/channels/smsStatus/messages/smsStatusRead'
      - $ref: '#/channels/smsStatus/messages/smsStatusCanceled'
      - $ref: '#/channels/smsStatus/messages/smsStatusPartiallyDelivered'
components:
  schemas:
    CallStatusEventWrapper:
      additionalProperties: true
      externalDocs:
        description: Twilio's voice service commom request parameters.
        url: https://www.twilio.com/docs/voice/twiml#request-parameters
      properties:
        AccountSid:
          type: string
          description: Your Twilio account ID. It is 34 characters long, and always starts with the letters AC.
        ApiVersion:
          type: string
          description: The version of the Twilio API used to handle this call.
        CallSid:
          type: string
          description: A unique identifier for this call, generated by Twilio.
        CallStatus:
          type: string
          description: A descriptive status for the call.
        CallToken:
          type: string
          description: A token string needed to invoke a forwarded call.
        Called:
          type: string
          description: Called number.
        CalledCity:
          type: string
          description: The city that called.
        CalledCountry:
          type: string
          description: The country that called.
        CalledState:
          type: string
          description: The state that called.
        CalledZip:
          type: string
          description: The zip code that called.
        Caller:
          type: string
          description: The number of the caller.
        CallerCity:
          type: string
          description: The city of the caller.
        CallerCountry:
          type: string
          description: The country of the caller.
        CallerState:
          type: string
          description: The state of the caller.
        CallerZip:
          type: string
          description: he zip code of the caller.
        Direction:
          type: string
          description: A string describing the direction of the call.
        From:
          type: string
          description: The phone number or client identifier of the party that initiated the call.
        FromCity:
          type: string
          description: The city of the caller.
        FromCountry:
          type: string
          description: The country of the caller.
        FromState:
          type: string
          description: The state or province of the caller.
        FromZip:
          type: string
          description: The postal code of the caller.
        StirPassportToken:
          type: string
          description: The identity token which contains the information needs for authentication and verification of calls.
        StirVerstat:
          type: string
          description: The value that verify the authentiticy of a caler ID on an incomming call.
        To:
          type: string
          description: The phone number or client identifier of the called party.
        ToCity:
          type: string
          description: The city of the called party.
        ToCountry:
          type: string
          description: The country of the called party.
        ToState:
          type: string
          description: The postal code of the called party.
        ToZip:
          type: string
          description: The postal code of the called party.
        RecordingSid:
          type: string
          description: The unique id of the Recording from this call.
        RecordingUrl:
          type: string
          description: The URL of the phone call's recorded audio.
        CallDuration:
          type: string
          description: The duration in seconds of the just-completed call.
        RecordingDuration:
          type: string
          description: The duration of the recorded audio (in seconds).
        Duration:
          type: string
          description: The duration in minutes of the just-completed call. Only present in the completed event.
        SipResponseCode:
          type: string
          description: The SIP response code for the call. Only present in terminal events.
        Timestamp:
          type: string
          description: When the event fired, as UTC in RFC 2822 format.
        CallbackSource:
          type: string
          description: Always `call-progress-events` on status callbacks.
        SequenceNumber:
          type: string
          description: The order in which the events were fired, starting from 0.
        StirStatus:
          type: string
          description: The STIR/SHAKEN attestation level, A, B or C.
        ParentCallSid:
          type: string
          description: The SID of the call that created this one, for a call created by a `<Dial>`.
        ForwardedFrom:
          type: string
          description: The number the call was forwarded from, when the carrier provides it.
        CallerName:
          type: string
          description: The caller's name, for an inbound call with Caller ID Lookup enabled.
    SmsStatusChangeEventWrapper:
      additionalProperties: true
      externalDocs:
        description: Twilio's message service commom request parameters.
        url: https://www.twilio.com/docs/messaging/guides/webhook-request#request-parameters
      properties:
        MessageSid:
          type: string
          description: A 34 character unique identifier for the message.
        SmsSid:
          type: string
          description: Same value as MessageSid. Deprecated and included for backward compatibility.
        AccountSid:
          type: string
          description: The 34 character id of the Account this message is associated with.
        MessagingServiceSid:
          type: string
          description: The 34 character id of the Messaging Service associated with the message.
        From:
          type: string
          description: The phone number or Channel address that sent this message.
        To:
          type: string
          description: The phone number or Channel address of the recipient.
        Body:
          type: string
          description: The text body of the message. Up to 1600 characters long.
        NumMedia:
          type: string
          description: The number of media items associated with your message.
        ReferralNumMedia:
          type: string
          description: The number of media items associated with a "Click to WhatsApp" advertisement.
        FromCity:
          type: string
          description: The city of the sender.
        FromState:
          type: string
          description: The state or province of the sender.
        SmsStatus:
          type: string
          description: The status of the message.
        FromZip:
          type: string
          description: The postal code of the called sender.
        FromCountry:
          type: string
          description: The country of the called sender.
        ToCity:
          type: string
          description: The city of the recipient.
        ToState:
          type: string
          description: The state or province of the recipient.
        ToZip:
          type: string
          description: The postal code of the recipient.
        ToCountry:
          type: string
          description: The country of the recipient.
        MessageStatus:
          type: string
          description: The status of the message.
        SmsMessageSid:
          type: string
          description: A unique identifier for this message, generated by Twilio.
        NumSegments:
          type: string
          description: Number of SMS messages it took to deliver the body of the message.
        ApiVersion:
          type: string
          description: The version of the Twilio API used to handle this message.
        ErrorCode:
          type: string
          description: The error code when `MessageStatus` is `failed` or `undelivered`.
        RawDlrDoneDate:
          type: string
          description: The carrier's delivery receipt Done Date, `YYMMDDhhmm`, for delivered or undelivered SMS and MMS.
        ChannelInstallSid:
          type: string
          description: The channel installation SID, for WhatsApp, RCS and other channels.
        ChannelStatusMessage:
          type: string
          description: The error message returned by the messaging channel when delivery failed.
        ChannelPrefix:
          type: string
          description: The channel prefix, such as `whatsapp`, for non-SMS channels.
        EventType:
          type: string
          description: Information about post-delivery events, for channels that report them.
